# pytest 配置
#
# 用法：python -m pytest tests -q          （全量，约 657 例）
#       python -m pytest tests -q -k render（按名字筛）
#
# 注意：tests/test_render.py 会真实渲染并写当天产物（output/数据/<年>/<月>/data_*.xlsx），
#      属已知副作用；tests/conftest.py 已把诊断目录重定向到临时目录，不会污染 output/数据校验/。
[pytest]
testpaths = tests
# 防止误扫：runtime/ 里是整个 Python 发行版，output/logs/data 是数据与产物
norecursedirs = .git .idea .codebuddy data output logs runtime __pycache__ .pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --strict-markers：写了未注册的 marker 直接报错（避免 @pytest.mark.xxx 拼错后静默跳过）
addopts = -v --tb=short --strict-markers
